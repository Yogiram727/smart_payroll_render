<div class="login-wrapper">
  <div class="login-container">
    <div class="login-card">
      <div class="login-header">
        <div class="logo">
          <svg width="48" height="48" viewBox="0 0 32 32" fill="none">
            <rect x="2" y="2" width="12" height="12" rx="3" fill="#d4af37"/>
            <rect x="18" y="2" width="12" height="12" rx="3" fill="rgba(212,175,55,0.4)"/>
            <rect x="2" y="18" width="12" height="12" rx="3" fill="rgba(212,175,55,0.4)"/>
            <rect x="18" y="18" width="12" height="12" rx="3" fill="rgba(212,175,55,0.7)"/>
          </svg>
        </div>
        <h1>Welcome Back</h1>
        <p>Sign in to continue to your dashboard</p>
      </div>

      <form (submit)="login()">
        <div class="input-group">
          <label>Username</label>
          <input
            type="text"
            [(ngModel)]="username"
            name="username"
            placeholder="Enter your username"
            required
          />
        </div>

        <div class="input-group">
          <label>Password</label>
          <input
            type="password"
            [(ngModel)]="password"
            name="password"
            placeholder="Enter your password"
            required
          />
        </div>

        <button type="submit" class="login-btn">Sign In</button>
      </form>
    </div>
  </div>
</div>
